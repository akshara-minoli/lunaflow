apiVersion: apps/v1
kind: Deployment
metadata:
  name: flonest-web
  namespace: flonest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flonest-web
  template:
    metadata:
      labels:
        app: flonest-web
    spec:
      containers:
        - name: web
          image: ghcr.io/akshara-minoli/flonest-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: flonest-config
                  key: API_UPSTREAM
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20