apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flonest

resources:
  - namespace.yaml
  - configmap.yaml
  - mongo-service.yaml
  - mongo-statefulset.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - frontend-service.yaml
  - frontend-deployment.yaml
  - ingress.yaml

images:
  - name: ghcr.io/akshara-minoli/flonest-server
    newTag: latest
  - name: ghcr.io/akshara-minoli/flonest-client
    newTag: latest