<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.5"/>
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Nest Shape -->
  <path d="M20,65 C20,80 35,85 50,85 C65,85 80,80 80,65 C80,65 72,70 50,70 C28,70 20,65 20,65 Z" fill="url(#roseGrad)" opacity="0.8"/>
  <path d="M30,72 C30,82 40,85 50,85 C60,85 70,82 70,72 C70,72 63,76 50,76 C37,76 30,72 30,72 Z" fill="#ffffff" opacity="0.3"/>
  
  <!-- Droplet/Flower Shape in center -->
  <path d="M50,20 C50,20 28,42 28,56 C28,68 37.8,74 50,74 C62.2,74 72,68 72,56 C72,42 50,20 50,20 Z" fill="url(#roseGrad)" filter="url(#glow)"/>
  
  <!-- Inner Detail Core -->
  <path d="M50,30 C50,30 35,46 35,56 C35,64 41.7,68 50,68 C58.3,68 65,64 65,56 C65,46 50,30 50,30 Z" fill="#ffffff" opacity="0.25"/>
