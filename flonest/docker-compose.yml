services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/flonest
      JWT_SECRET: change-me-in-production
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:5000
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data: